<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#0b0f14;
color:#fff;
overflow-x:hidden;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:15px;
}

/* BTN */
.btn{
padding:12px 24px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:#fff;
border-radius:10px;
cursor:pointer;
backdrop-filter:blur(6px);
}

/* NETFLIX GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
max-width:1100px;
margin:40px auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:14px;
padding:15px;
cursor:pointer;
transition:0.3s;
position:relative;
}

.card:hover{
transform:scale(1.05);
}

/* DELETE BUTTON */
.del{
position:absolute;
top:8px;
right:8px;
background:red;
border:none;
color:#fff;
border-radius:6px;
padding:4px 8px;
cursor:pointer;
display:none;
}

.admin .del{display:block;}

/* EPISODE VIEW */
#episodeView{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
backdrop-filter:blur(8px);
padding:40px;
z-index:5000;
}

#episodeBox{
max-width:800px;
margin:auto;
background:rgba(20,25,35,0.95);
padding:20px;
border-radius:14px;
}

/* ADMIN PANEL */
#adminPanel{
display:none;
position:fixed;
top:20px;
right:20px;
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:10px;
cursor:pointer;
}

/* ADMIN DASHBOARD */
#adminDash{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(8px);
z-index:4000;
justify-content:center;
align-items:center;
}

.box{
background:rgba(20,25,35,0.95);
padding:20px;
border-radius:14px;
width:320px;
}

input,textarea{
width:100%;
margin-top:10px;
padding:8px;
border-radius:8px;
border:none;
background:#111;
color:#fff;
}

textarea{min-height:120px;}

.close{
position:absolute;
top:10px;
right:10px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
<h1>THE SLEEPLESS CITY</h1>
<p>Netflix RP Story System</p>

<button class="btn" onclick="loginAdmin()">Admin Login</button>
</section>

<!-- EPISODES -->
<div class="grid" id="grid"></div>

<!-- EPISODE VIEW -->
<div id="episodeView" onclick="closeEpisode()">
<div id="episodeBox"></div>
</div>

<!-- ADMIN BUTTON -->
<div id="adminPanel" onclick="openDash()">Admin Panel</div>

<!-- ADMIN DASH -->
<div id="adminDash">
<div class="box">
<span class="close" onclick="closeDash()">❌</span>

<h3>Admin Dashboard</h3>

<input id="title" placeholder="Titel">
<textarea id="content" placeholder="Story Inhalt"></textarea>

<button class="btn" onclick="addEpisode()">Posten</button>
</div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBfcD74FW6VcsdYGcc0xIHC-5M2W4z0E8s",
  authDomain: "sleepless-city.firebaseapp.com",
  projectId: "sleepless-city"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ref = db.collection("episodes");

/* ADMIN STATE */
let isAdmin=false;

/* LOGIN */
function loginAdmin(){
let p=prompt("Admin Passwort:");
if(p==="1234"){
isAdmin=true;
document.getElementById("adminPanel").style.display="block";
render();
alert("Admin eingeloggt");
}
}

/* DASH */
function openDash(){
document.getElementById("adminDash").style.display="flex";
}
function closeDash(){
document.getElementById("adminDash").style.display="none";
}

/* ADD EPISODE */
function addEpisode(){
let title=document.getElementById("title").value;
let content=document.getElementById("content").value;

ref.add({title,content,time:Date.now()});

document.getElementById("title").value="";
document.getElementById("content").value="";
}

/* DELETE */
function del(id){
ref.doc(id).delete();
}

/* OPEN EPISODE */
function openEpisode(data){
document.getElementById("episodeView").style.display="block";
document.getElementById("episodeBox").innerHTML=`
<h2>${data.title}</h2>
<p>${data.content}</p>
`;
}

/* CLOSE */
function closeEpisode(){
document.getElementById("episodeView").style.display="none";
}

/* LIVE */
ref.orderBy("time","desc").onSnapshot(snap=>{
let grid=document.getElementById("grid");
grid.innerHTML="";

snap.forEach(doc=>{
let d=doc.data();

grid.innerHTML+=`
<div class="card ${isAdmin?'admin':''}">
<h3>${d.title}</h3>

<button class="del" onclick="del('${doc.id}')">🗑</button>

<p>${d.content.substring(0,80)}...</p>

<button class="btn" onclick='openEpisode(${JSON.stringify(d)})'>Öffnen</button>
</div>`;
});
});

</script>

</body>
</html>
