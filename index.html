<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#0b0f14;
color:#e6e6e6;
overflow-x:hidden;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:15px;
}

.btn{
padding:12px 24px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:#fff;
border-radius:10px;
cursor:pointer;
backdrop-filter:blur(6px);
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:14px;
display:flex;
justify-content:center;
gap:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
z-index:1000;
}
nav a{color:#cfd6dd;text-decoration:none;}

/* STORY */
.story-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:14px;
padding:18px;
margin:15px auto;
max-width:800px;
position:relative;
animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

/* CHAPTER UI */
.chapter{
margin-top:30px;
font-size:20px;
opacity:0.8;
font-weight:600;
}

/* DELETE */
.delBtn{
position:absolute;
top:10px;
right:10px;
background:red;
border:none;
color:white;
padding:5px 8px;
border-radius:6px;
cursor:pointer;
}

/* ADMIN */
#storyAdmin{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(20,25,35,0.95);
padding:20px;
border-radius:14px;
width:400px;
z-index:5000;
}

.editor{
background:rgba(0,0,0,0.5);
border:1px solid rgba(255,255,255,0.1);
padding:10px;
min-height:140px;
border-radius:8px;
margin-top:10px;
}

/* FLOAT BUTTON */
#openAdminBtn{
display:none;
position:fixed;
bottom:20px;
right:20px;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
padding:12px 16px;
border-radius:12px;
cursor:pointer;
z-index:6000;
}

/* LOGIN */
#loginBox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(8px);
justify-content:center;
align-items:center;
z-index:7000;
}

.login{
background:#111;
padding:20px;
border-radius:12px;
width:280px;
}

.login input{
width:100%;
margin:6px 0;
padding:8px;
border-radius:6px;
border:none;
}

/* SEASON UI */
.seasons{
display:flex;
justify-content:center;
gap:10px;
margin:20px;
}
.season{
padding:8px 14px;
border:1px solid rgba(255,255,255,0.2);
border-radius:10px;
cursor:pointer;
background:rgba(255,255,255,0.05);
}
.season.active{
background:rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<nav>
<a href="#story">Story</a>
<a href="#team">Team</a>
<a href="#rules">Regeln</a>
</nav>

<section class="hero">
<h1>THE SLEEPLESS CITY</h1>
<p>Eine Stadt ohne Ruhe</p>
<button class="btn">Discord beitreten</button>
</section>

<!-- STORY -->
<section id="story" style="padding:80px 20px;text-align:center;">
<h2>📖 Story</h2>

<!-- SEASONS -->
<div class="seasons">
<div class="season active" onclick="filterSeason('all')">Alle</div>
<div class="season" onclick="filterSeason('1')">Staffel 1</div>
<div class="season" onclick="filterSeason('2')">Staffel 2</div>
<div class="season" onclick="filterSeason('3')">Staffel 3</div>
</div>

<div id="storyList"></div>
</section>

<!-- ADMIN -->
<div id="storyAdmin">

<h3>Story Editor</h3>

<input id="chapter" placeholder="Staffel (1/2/3)" style="width:100%;padding:8px;margin-top:10px;">
<input id="title" placeholder="Titel" style="width:100%;padding:8px;margin-top:10px;">

<div id="editor" class="editor" contenteditable="true"></div>

<button class="btn" onclick="addStory()" style="margin-top:10px;">Posten</button>
</div>

<!-- LOGIN -->
<div id="loginBox">
<div class="login">
<h3>Admin Login</h3>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Passwort">
<button class="btn" onclick="login()">Login</button>
</div>
</div>

<!-- ADMIN BTN -->
<div id="openAdminBtn" onclick="openAdmin()">🧠 Admin</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBfcD74FW6VcsdYGcc0xIHC-5M2W4z0E8s",
  authDomain: "sleepless-city.firebaseapp.com",
  projectId: "sleepless-city",
  storageBucket: "sleepless-city.firebasestorage.app",
  messagingSenderId: "34631955151",
  appId: "1:34631955151:web:107f9312dae475fac23dba"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storiesRef = db.collection("stories");

let loggedIn = false;
let currentFilter = "all";

/* HOTKEY LOGIN */
document.addEventListener("keydown",e=>{
if(e.ctrlKey && e.altKey && e.key.toLowerCase()==="a"){
document.getElementById("loginBox").style.display="flex";
}
});

/* LOGIN */
function login(){
let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

if(u==="admin" && p==="1234"){
loggedIn=true;
document.getElementById("loginBox").style.display="none";
document.getElementById("openAdminBtn").style.display="block";
}else{
alert("Falsch");
}
}

/* ADMIN OPEN */
function openAdmin(){
if(loggedIn){
document.getElementById("storyAdmin").style.display="block";
}
}

/* ADD */
function addStory(){
storiesRef.add({
chapter:document.getElementById("chapter").value,
title:document.getElementById("title").value,
content:document.getElementById("editor").innerHTML,
time:Date.now()
});
}

/* DELETE */
function deleteStory(id){
storiesRef.doc(id).delete();
}

/* FILTER */
function filterSeason(s){
currentFilter=s;
load();
}

/* LIVE */
function load(){
storiesRef.orderBy("time","desc").onSnapshot(snap=>{
let c=document.getElementById("storyList");
c.innerHTML="";

let last="";

snap.forEach(doc=>{
let s=doc.data();

if(currentFilter!=="all" && s.chapter!==currentFilter) return;

if(s.chapter!==last){
c.innerHTML+=`<div class="chapter">Staffel ${s.chapter}</div>`;
last=s.chapter;
}

c.innerHTML+=`
<div class="story-box">
<button class="delBtn" onclick="deleteStory('${doc.id}')">X</button>
<h3>${s.title}</h3>
<div>${s.content}</div>
</div>`;
});
});
}

load();

</script>

</body>
</html>
