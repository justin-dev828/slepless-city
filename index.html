<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{background:black;color:#FFD700;overflow-x:hidden;}

nav{
position:fixed;
top:0;
width:100%;
padding:15px;
display:flex;
justify-content:center;
gap:20px;
background:rgba(0,0,0,0.6);
z-index:1000;
}

nav a{color:#FFD700;text-decoration:none;}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:20px;
}

.btn{
padding:15px 30px;
border:2px solid #FFD700;
background:transparent;
color:#FFD700;
cursor:pointer;
}

.section{
padding:80px 20px;
text-align:center;
opacity:0;
transform:translateY(40px);
transition:0.6s;
}

.section.show{
opacity:1;
transform:translateY(0);
}

/* LOGIN */
#loginModal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:2000;
}

.login-box{
background:black;
padding:30px;
border:1px solid #FFD700;
text-align:center;
}

.login-box input{
margin:10px;
padding:10px;
background:black;
border:1px solid #FFD700;
color:#FFD700;
}

/* MAINTENANCE */
#maintenanceOverlay{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:black;
color:#FFD700;
z-index:9999;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.switch{
margin-top:20px;
}

</style>
</head>

<body>

<!-- MAINTENANCE SCREEN -->
<div id="maintenanceOverlay">
<h1>🚧 Wartungsmodus aktiv</h1>
<p>Die Seite ist gerade offline</p>

<button class="btn" onclick="openLogin()">🔐 Admin Login</button>
</div>

<!-- LOGIN -->
<div id="loginModal">
<div class="login-box">
<h2>Admin Login</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Passwort"><br>
<button class="btn" onclick="login()">Login</button>
</div>
</div>

<nav>
<a href="#home">Home</a>
<a href="#team">Team</a>
<a href="#rules">Regeln</a>
</nav>

<section class="hero section show" id="home">
<h1>THE SLEEPLESS CITY</h1>
<p>Die Stadt schläft nie</p>

<button class="btn" onclick="window.location.href='https://discord.gg/'">
Join Discord
</button>
</section>

<section class="section" id="team">
<h2>Team</h2>
<p>Owner / Admin / Support</p>
</section>

<section class="section" id="rules">
<h2>Regeln</h2>
<p>Respekt • Kein Cheat • Fair Play</p>
</section>

<!-- ADMIN PANEL -->
<section style="text-align:center;padding:40px;">
<h2>Admin Panel</h2>

<label>
<input type="checkbox" onchange="toggleMaintenance(this)">
<span> Wartungsmodus</span>
</label>
</section>

<script>
const maintenanceOverlay = document.getElementById("maintenanceOverlay");
const loginModal = document.getElementById("loginModal");

let maintenance = localStorage.getItem("maintenance") || "off";

/* APPLY STATE */
function apply(){
if(maintenance === "on"){
maintenanceOverlay.style.display = "flex";
}else{
maintenanceOverlay.style.display = "none";
}
}

apply();

/* OPEN LOGIN */
function openLogin(){
loginModal.style.display = "flex";
}

/* LOGIN */
function login(){
let u = document.getElementById("user").value;
let p = document.getElementById("pass").value;

if(u === "admin" && p === "1234"){
loginModal.style.display = "none";

/* Wartung AUS */
maintenance = "off";
localStorage.setItem("maintenance","off");
apply();

alert("Login erfolgreich");
}else{
alert("Falsch");
}
}

/* TOGGLE WARTUNG */
function toggleMaintenance(el){

maintenance = el.checked ? "on" : "off";
localStorage.setItem("maintenance", maintenance);
apply();
}

/* SCROLL EFFECT */
const sections = document.querySelectorAll(".section");

window.addEventListener("scroll", () => {
sections.forEach(s => {
if(s.getBoundingClientRect().top < window.innerHeight - 100){
s.classList.add("show");
}
});
});
</script>

</body>
</html>
