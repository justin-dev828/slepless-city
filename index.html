<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0b0f14;
color:#e6e6e6;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df") center/cover no-repeat;
filter:brightness(0.2) saturate(0.8);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:rgba(10,15,20,0.75);
z-index:-1;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:14px 30px;
display:flex;
justify-content:center;
gap:25px;
background:rgba(15,20,28,0.6);
backdrop-filter: blur(10px);
border-bottom:1px solid rgba(255,255,255,0.05);
z-index:1000;
}

nav a{
color:#cfd6dd;
text-decoration:none;
font-size:14px;
letter-spacing:0.5px;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:18px;
padding:20px;
}

.hero h1{
font-size:48px;
font-weight:700;
color:#fff;
}

.hero p{
color:#aab4be;
}

/* BUTTON */
.btn{
padding:12px 24px;
border:1px solid rgba(255,255,255,0.2);
background:rgba(255,255,255,0.05);
color:#fff;
cursor:pointer;
border-radius:8px;
}

/* SECTION */
.section{
padding:90px 20px;
text-align:center;
opacity:0;
transform:translateY(30px);
transition:0.6s;
}

.section.show{
opacity:1;
transform:translateY(0);
}

/* TEAM */
.team{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:25px;
}

.member{
width:230px;
padding:18px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:12px;
}

/* RULES */
.rules-container{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
gap:18px;
max-width:1100px;
margin:40px auto;
}

.rule-box{
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.08);
padding:18px;
border-radius:12px;
text-align:left;
}

/* LOGIN */
#loginModal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
justify-content:center;
align-items:center;
z-index:2000;
}

.login-box{
background:#111823;
padding:30px;
border-radius:12px;
width:280px;
}

.login-box input{
width:100%;
margin:8px 0;
padding:10px;
background:#0b0f14;
color:#fff;
border:1px solid rgba(255,255,255,0.1);
border-radius:8px;
}

/* ADMIN */
#adminPanel{
display:none;
position:fixed;
bottom:20px;
right:20px;
background:#111823;
padding:14px;
border-radius:12px;
}

/* STORY */
#storyList{
max-width:900px;
margin:40px auto;
display:flex;
flex-direction:column;
gap:15px;
}

.story-box{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
padding:18px;
border-radius:12px;
text-align:left;
}

#storyAdmin{
display:none;
position:fixed;
left:20px;
bottom:20px;
background:#111823;
padding:15px;
border-radius:12px;
width:260px;
}
#storyAdmin input, #storyAdmin textarea{
width:100%;
margin:5px 0;
padding:8px;
background:#0b0f14;
color:#fff;
border-radius:8px;
border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginModal">
<div class="login-box">
<h3>Admin Login</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Passwort">
<button class="btn" onclick="login()">Login</button>
</div>
</div>

<!-- NAV -->
<nav>
<a href="#home">Home</a>
<a href="#team">Team</a>
<a href="#rules">Regeln</a>
<a href="#story">Story</a>
</nav>

<!-- HERO -->
<section class="hero section show" id="home">
<h1>THE SLEEPLESS CITY</h1>
<p>Eine Stadt ohne Ruhe</p>
<button class="btn">Discord beitreten</button>
</section>

<!-- TEAM -->
<section class="section" id="team">
<h2>Team</h2>
<div class="team">
<div class="member">Owner</div>
<div class="member">Admin</div>
<div class="member">Support</div>
</div>
</section>

<!-- RULES -->
<section class="section" id="rules">
<h2>Regeln</h2>
<div class="rules-container">
<div class="rule-box">Allgemein</div>
<div class="rule-box">Roleplay</div>
<div class="rule-box">Combat</div>
<div class="rule-box">Verboten</div>
</div>
</section>

<!-- STORY -->
<section class="section" id="story">
<h2>📖 Story</h2>
<div id="storyList"></div>
</section>

<!-- ADMIN -->
<div id="adminPanel">Admin eingeloggt</div>

<!-- STORY ADMIN -->
<div id="storyAdmin">
<h3>Story Admin</h3>
<input id="storyTitle" placeholder="Titel">
<textarea id="storyText" placeholder="Text"></textarea>
<button class="btn" onclick="addStory()">Posten</button>
<div id="adminStoryList"></div>
</div>

<script>
const loginModal = document.getElementById("loginModal");
const adminPanel = document.getElementById("adminPanel");

let stories = JSON.parse(localStorage.getItem("stories")) || [];

/* LOGIN */
function openLogin(){
loginModal.style.display="flex";
}

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="1234"){
loginModal.style.display="none";
adminPanel.style.display="block";
document.getElementById("storyAdmin").style.display="block";
renderAdmin();
}else{
alert("Falsch");
}
}

/* STORY */
function save(){
localStorage.setItem("stories",JSON.stringify(stories));
render();
renderAdmin();
}

function addStory(){
let t=document.getElementById("storyTitle").value;
let txt=document.getElementById("storyText").value;

if(!t||!txt)return;

stories.push({id:Date.now(),title:t,text:txt});
document.getElementById("storyTitle").value="";
document.getElementById("storyText").value="";
save();
}

function deleteStory(id){
stories=stories.filter(s=>s.id!==id);
save();
}

function editStory(id){
let s=stories.find(x=>x.id===id);
let nt=prompt("Titel",s.title);
let nx=prompt("Text",s.text);
if(nt&&nx){
s.title=nt;
s.text=nx;
save();
}
}

function render(){
let c=document.getElementById("storyList");
c.innerHTML="";
stories.forEach(s=>{
c.innerHTML+=`
<div class="story-box">
<h3>${s.title}</h3>
<p>${s.text}</p>
</div>`;
});
}

function renderAdmin(){
let c=document.getElementById("adminStoryList");
c.innerHTML="";
stories.forEach(s=>{
c.innerHTML+=`
<div class="story-box">
<b>${s.title}</b><br>
<button onclick="editStory(${s.id})">Edit</button>
<button onclick="deleteStory(${s.id})">Delete</button>
</div>`;
});
}

/* SCROLL */
const sections=document.querySelectorAll(".section");
window.addEventListener("scroll",()=>{
sections.forEach(s=>{
if(s.getBoundingClientRect().top<window.innerHeight-100){
s.classList.add("show");
}
});
});

render();
</script>

</body>
</html>
