<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#0b0f14;
color:#e6e6e6;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df") center/cover no-repeat;
filter:brightness(0.25);
z-index:-2;
}
body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.65);
z-index:-1;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:14px;
display:flex;
justify-content:center;
gap:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
z-index:1000;
}
nav a{color:#cfd6dd;text-decoration:none;}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:15px;
}

/* BUTTON */
.btn{
padding:12px 24px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:#fff;
border-radius:10px;
cursor:pointer;
backdrop-filter:blur(6px);
}

/* GLASS */
.member,.rule-box,.story-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:14px;
}

.team{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.member{width:230px;padding:18px;}

.rules-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
max-width:1100px;
margin:40px auto;
}
.rule-box{padding:18px;text-align:left;}

.story-box{
padding:18px;
margin:10px auto;
max-width:800px;
text-align:left;
}

/* ADMIN */
#storyAdmin{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(20,25,35,0.95);
padding:20px;
border-radius:14px;
width:320px;
z-index:4000;
}

.editor{
background:rgba(0,0,0,0.5);
border:1px solid rgba(255,255,255,0.1);
padding:10px;
min-height:120px;
border-radius:8px;
}

/* OVERLAY */
#overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(6px);
z-index:3000;
}
</style>
</head>

<body>

<div id="overlay" onclick="closeAdmin()"></div>

<!-- NAV -->
<nav>
<a href="#home">Home</a>
<a href="#team">Team</a>
<a href="#rules">Regeln</a>
<a href="#story">Story</a>
</nav>

<!-- HERO -->
<section class="hero">
<h1>THE SLEEPLESS CITY</h1>
<p>Eine Stadt ohne Ruhe</p>

<button class="btn" onclick="window.location.href='https://discord.gg/'">
Discord beitreten
</button>
</section>

<!-- STORY -->
<section id="story" style="padding:90px 20px;text-align:center;">
<h2>📖 Story</h2>
<div id="storyList"></div>
</section>

<!-- ADMIN -->
<div id="storyAdmin">
<div style="display:flex;justify-content:space-between;">
<h3>Story Admin</h3>
<button class="btn" onclick="closeAdmin()">X</button>
</div>

<input id="storyTitle" placeholder="Titel" style="width:100%;margin-top:10px;padding:8px;">
<div id="editor" class="editor" contenteditable="true"></div>

<button class="btn" onclick="addStory()">Posten</button>
</div>

<script>

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBfcD74FW6VcsdYGcc0xIHC-5M2W4z0E8s",
  authDomain: "sleepless-city.firebaseapp.com",
  projectId: "sleepless-city",
  storageBucket: "sleepless-city.firebasestorage.app",
  messagingSenderId: "34631955151",
  appId: "1:34631955151:web:107f9312dae475fac23dba"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storiesRef = db.collection("stories");

/* ADMIN OPEN */
function openAdmin(){
document.getElementById("storyAdmin").style.display="block";
document.getElementById("overlay").style.display="block";
}

/* CLOSE */
function closeAdmin(){
document.getElementById("storyAdmin").style.display="none";
document.getElementById("overlay").style.display="none";
}

/* HOTKEY STRG + ALT + A */
document.addEventListener("keydown",e=>{
if(e.ctrlKey && e.altKey && e.key.toLowerCase()==="a"){
openAdmin();
}
});

/* ADD STORY (ONLINE) */
function addStory(){
let title=document.getElementById("storyTitle").value;
let content=document.getElementById("editor").innerHTML;

if(!title||!content)return;

storiesRef.add({
title,
content,
time:Date.now()
});

document.getElementById("storyTitle").value="";
document.getElementById("editor").innerHTML="";
}

/* LIVE LOAD */
storiesRef.orderBy("time","desc").onSnapshot(snapshot=>{
let c=document.getElementById("storyList");
c.innerHTML="";

snapshot.forEach(doc=>{
let s=doc.data();

c.innerHTML+=`
<div class="story-box">
<h3>${s.title}</h3>
<div>${s.content}</div>
</div>`;
});
});

</script>

</body>
</html>
