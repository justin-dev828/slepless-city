<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}

body{
background:black;
color:#FFD700;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df") center/cover no-repeat;
filter:brightness(0.25);
z-index:-2;
}

body::after{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:-1;
}

/* LOGIN */
#login-screen{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:1s;
}

.login-box{
border:2px solid #FFD700;
padding:40px;
text-align:center;
box-shadow:0 0 30px #FFD700;
background:rgba(0,0,0,0.9);
}

.login-box input{
margin-top:15px;
padding:10px;
width:200px;
background:black;
border:1px solid #FFD700;
color:#FFD700;
text-align:center;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:15px;
display:flex;
justify-content:center;
gap:20px;
background:rgba(0,0,0,0.6);
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
text-align:center;
}

.neon-box{
padding:20px 40px;
border:2px solid #FFD700;
box-shadow:0 0 20px #FFD700;
}

.btn{
padding:15px 30px;
border:2px solid #FFD700;
background:transparent;
color:#FFD700;
cursor:pointer;
}

/* ADMIN PANEL */
#admin-panel{
display:none;
padding:50px;
text-align:center;
border-top:2px solid #FFD700;
}

.admin-box{
border:1px solid #FFD700;
padding:20px;
margin:10px;
display:inline-block;
}
</style>
</head>

<body>

<!-- SOUND -->
<audio id="sound">
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b0c3c.mp3">
</audio>

<!-- LOGIN -->
<div id="login-screen">
<div class="login-box">
<h1>ADMIN LOGIN</h1>

<input type="password" id="code" placeholder="Admin Code">
<br><br>

<button class="btn" onclick="login()">Login</button>

<p onclick="skip()" style="margin-top:15px;cursor:pointer;">
➡️ Weiter ohne Login
</p>
</div>
</div>

<nav>
<a href="#">Home</a>
<a href="#admin-panel">Admin</a>
</nav>

<section class="hero">
<div class="neon-box">
<h1>THE SLEEPLESS CITY</h1>
</div>
</section>

<!-- ADMIN PANEL -->
<section id="admin-panel">

<h2>🟢 ADMIN PANEL</h2>

<div class="admin-box">
<p>👤 Spieler verwalten</p>
</div>

<div class="admin-box">
<p>📊 Server Stats</p>
</div>

<div class="admin-box">
<p>🔒 Geheime Einstellungen</p>
</div>

<p style="margin-top:20px;opacity:0.6;">
Nur sichtbar für Admins
</p>

</section>

<script>

// LOGIN
function login(){
let code = document.getElementById("code").value;

if(code === "admin123"){
document.getElementById("sound").play();
document.getElementById("admin-panel").style.display = "block";
fade();
alert("Admin Zugriff!");
}else{
alert("Falsch");
}
}

// USER SKIP
function skip(){
fade();
}

// FADE
function fade(){
let screen = document.getElementById("login-screen");
screen.style.opacity = "0";

setTimeout(()=>{
screen.style.display="none";
},1000);
}

</script>

</body>
</html>
