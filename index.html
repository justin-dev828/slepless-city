<script>
// LOGIN DATEN (fake DB)
const admins = [
  {user: "admin", pass: "1234"},
  {user: "dev", pass: "2026"}
];

// STATE
let isAdmin = false;

// CHECK MAINTENANCE
if(localStorage.getItem("maintenance")==="on"){
activateMaintenance();
}

// SECRET LOGIN (5 clicks)
let clicks=0;
document.querySelector(".neon-box").addEventListener("click",()=>{
clicks++;
if(clicks>=5){
showLogin();
clicks=0;
}
});

// LOGIN UI
function showLogin(){
let user = prompt("Username:");
let pass = prompt("Passwort:");

let found = admins.find(a => a.user===user && a.pass===pass);

if(found){
isAdmin = true;
document.getElementById("sound").play();
document.getElementById("admin-panel").style.display="block";
loadToggleState();
}else{
alert("Falsch");
}
}

// TOGGLE SWITCH STATE LADEN
function loadToggleState(){
let state = localStorage.getItem("maintenance");
let btn = document.getElementById("maint-toggle");

if(state==="on"){
btn.innerText = "🟢 Wartung AN";
btn.style.borderColor="lime";
}else{
btn.innerText = "🔴 Wartung AUS";
btn.style.borderColor="red";
}
}

// TOGGLE BUTTON
function toggleMaintenance(){
let state = localStorage.getItem("maintenance");

if(state==="on"){
localStorage.setItem("maintenance","off");
}else{
localStorage.setItem("maintenance","on");
}

loadToggleState();
setTimeout(()=>location.reload(),500);
}

// BESSERE WARTUNGSSEITE
function activateMaintenance(){
document.body.innerHTML = `
<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
color:#FFD700;
text-align:center;
font-family:Orbitron;
">
<h1 style="font-size:50px;">🚧 WARTUNG</h1>
<p style="opacity:0.7;">Die Stadt wird gerade verbessert...</p>

<button onclick="adminBypass()" style="
margin-top:30px;
padding:12px 25px;
border:1px solid gold;
background:none;
color:gold;
cursor:pointer;
">
🔐 Admin Login
</button>
</div>`;
}

// ADMIN BYPASS
function adminBypass(){
let user = prompt("Username:");
let pass = prompt("Passwort:");

let found = admins.find(a => a.user===user && a.pass===pass);

if(found){
localStorage.setItem("maintenance","off");
location.reload();
}else{
alert("Falsch");
}
}

// BUTTON ACTIONS
function openPlayers(){
window.open("https://discord.com","_blank");
}

// SCROLL
const sections=document.querySelectorAll('.section');
window.addEventListener('scroll',()=>{
sections.forEach(s=>{
if(s.getBoundingClientRect().top<window.innerHeight-100){
s.classList.add('show');
}
});
});
</script>
