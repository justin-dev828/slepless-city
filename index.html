<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#0b0f14;
color:#e6e6e6;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df") center/cover no-repeat;
filter:brightness(0.25);
z-index:-2;
}
body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.65);
z-index:-1;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:15px;
}

/* BUTTON */
.btn{
padding:12px 24px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:#fff;
border-radius:10px;
cursor:pointer;
backdrop-filter:blur(6px);
}

/* STORY CARD (NETFLIX STYLE) */
.story-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:14px;
padding:18px;
margin:15px auto;
max-width:800px;
text-align:left;

opacity:0;
transform:translateY(20px);
animation:fadeIn 0.4s forwards;
transition:0.3s;
}

.story-box:hover{
transform:scale(1.02);
}

@keyframes fadeIn{
to{opacity:1;transform:translateY(0);}
}

/* CHAPTER STYLE */
.chapter{
margin-top:40px;
font-size:20px;
font-weight:600;
opacity:0.8;
}

/* ADMIN */
#storyAdmin{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(20,25,35,0.95);
padding:20px;
border-radius:14px;
width:380px;
z-index:4000;
}

.editor{
background:rgba(0,0,0,0.5);
border:1px solid rgba(255,255,255,0.1);
padding:10px;
min-height:140px;
border-radius:8px;
margin-top:8px;
}

/* TOOLBAR */
.toolbar{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:10px;
}

.toolbar button{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
color:white;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

input[type="color"]{
width:35px;
height:30px;
border:none;
background:none;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
<h1>THE SLEEPLESS CITY</h1>
<p>Eine Stadt ohne Ruhe</p>

<button class="btn" onclick="window.location.href='https://discord.gg/'">
Discord beitreten
</button>
</section>

<!-- STORY -->
<section id="story" style="padding:90px 20px;text-align:center;">
<h2>📖 Story</h2>
<div id="storyList"></div>
</section>

<!-- ADMIN -->
<div id="storyAdmin">

<h3>Notion Story Editor</h3>

<input id="chapter" placeholder="Staffel / Kapitel (z.B. Staffel 1 - Kapitel 1)" style="width:100%;padding:8px;margin-top:10px;">
<input id="storyTitle" placeholder="Titel" style="width:100%;padding:8px;margin-top:10px;">

<!-- TOOLBAR -->
<div class="toolbar">
<button onclick="format('bold')"><b>B</b></button>
<button onclick="format('italic')"><i>I</i></button>
<button onclick="format('formatBlock','h2')">H2</button>
<button onclick="format('insertUnorderedList')">• Liste</button>
<input type="color" onchange="setColor(this.value)">
<input type="file" id="imgUpload">
</div>

<div id="editor" class="editor" contenteditable="true"></div>

<button class="btn" onclick="addStory()">Posten</button>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBfcD74FW6VcsdYGcc0xIHC-5M2W4z0E8s",
  authDomain: "sleepless-city.firebaseapp.com",
  projectId: "sleepless-city",
  storageBucket: "sleepless-city.firebasestorage.app",
  messagingSenderId: "34631955151",
  appId: "1:34631955151:web:107f9312dae475fac23dba"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

const storiesRef = db.collection("stories");

/* ADMIN OPEN */
document.addEventListener("keydown",e=>{
if(e.ctrlKey && e.altKey && e.key.toLowerCase()==="a"){
document.getElementById("storyAdmin").style.display="block";
}
});

/* FORMAT */
function format(cmd,value=null){
document.execCommand(cmd,false,value);
}

function setColor(color){
document.execCommand("foreColor",false,color);
}

/* IMAGE UPLOAD */
document.getElementById("imgUpload").addEventListener("change", async (e)=>{
const file = e.target.files[0];
if(!file) return;

const ref = storage.ref("stories/" + Date.now() + file.name);
await ref.put(file);
const url = await ref.getDownloadURL();

document.execCommand("insertImage",false,url);
});

/* ADD STORY */
function addStory(){
let chapter=document.getElementById("chapter").value;
let title=document.getElementById("storyTitle").value;
let content=document.getElementById("editor").innerHTML;

if(!title||!content||!chapter)return;

storiesRef.add({
chapter,
title,
content,
time:Date.now()
});

document.getElementById("chapter").value="";
document.getElementById("storyTitle").value="";
document.getElementById("editor").innerHTML="";
}

/* LIVE LOAD + CHAPTERS */
storiesRef.orderBy("time","desc").onSnapshot(snapshot=>{
let c=document.getElementById("storyList");
c.innerHTML="";

let lastChapter="";

snapshot.forEach(doc=>{
let s=doc.data();

if(s.chapter !== lastChapter){
c.innerHTML += `<div class="chapter">${s.chapter}</div>`;
lastChapter = s.chapter;
}

c.innerHTML+=`
<div class="story-box">
<h3>${s.title}</h3>
<div>${s.content}</div>
</div>`;
});
});

</script>

</body>
</html>
