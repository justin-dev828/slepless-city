<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#0b0f14;
color:#e6e6e6;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df") center/cover no-repeat;
filter:brightness(0.25);
z-index:-2;
}
body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.65);
z-index:-1;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:15px;
}

.btn{
padding:12px 24px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:#fff;
border-radius:10px;
cursor:pointer;
backdrop-filter:blur(6px);
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:14px;
display:flex;
justify-content:center;
gap:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
z-index:1000;
}
nav a{color:#cfd6dd;text-decoration:none;}

/* SECTIONS */
.section{padding:80px 20px;text-align:center;}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:14px;
padding:18px;
max-width:900px;
margin:10px auto;
text-align:left;
}

/* STORY */
.story-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:14px;
padding:18px;
margin:15px auto;
max-width:800px;
position:relative;
animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

.chapter{
margin-top:30px;
font-size:20px;
opacity:0.8;
font-weight:600;
}

/* DELETE */
.delBtn{
position:absolute;
top:10px;
right:10px;
background:red;
border:none;
color:white;
padding:5px 8px;
border-radius:6px;
cursor:pointer;
}

/* ADMIN */
#storyAdmin{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(20,25,35,0.95);
padding:20px;
border-radius:14px;
width:400px;
z-index:5000;
}

/* EDITOR */
.editor{
background:rgba(0,0,0,0.5);
border:1px solid rgba(255,255,255,0.1);
padding:10px;
min-height:140px;
border-radius:8px;
margin-top:10px;
}

/* FLOAT ADMIN */
#openAdminBtn{
display:none;
position:fixed;
bottom:20px;
right:20px;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
padding:12px 16px;
border-radius:12px;
cursor:pointer;
z-index:6000;
}

/* LOGIN */
#loginBox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(8px);
justify-content:center;
align-items:center;
z-index:7000;
}

.login{
background:#111;
padding:20px;
border-radius:12px;
width:280px;
}

.login input{
width:100%;
margin:6px 0;
padding:8px;
}

/* CLOSE BUTTON (NEU DESIGN) */
.closeAdmin{
position:absolute;
top:12px;
right:12px;
padding:8px 12px;
border-radius:10px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:white;
cursor:pointer;
backdrop-filter:blur(10px);
transition:0.2s;
}

.closeAdmin:hover{
background:rgba(255,255,255,0.18);
}
</style>
</head>

<body>

<nav>
<a href="#story">Story</a>
<a href="#team">Team</a>
<a href="#rules">Regeln</a>
</nav>

<section class="hero">
<h1>THE SLEEPLESS CITY</h1>
<p>Eine Stadt ohne Ruhe</p>
<button class="btn">Discord beitreten</button>
</section>

<section id="story" class="section">
<h2>📖 Story</h2>
<div id="storyList"></div>
</section>

<section class="section">
<h2>👥 Team</h2>

<div class="card"><b>Owner</b><br>Leitet das Projekt</div>
<div class="card"><b>Admin</b><br>Verwaltet Stories</div>
<div class="card"><b>Support</b><br>Hilft Spielern</div>
</section>

<section class="section">
<h2>📜 Regeln</h2>

<div class="card">Respektvoll bleiben</div>
<div class="card">Kein Metagaming</div>
<div class="card">Kein Cheating</div>
</section>

<!-- ADMIN -->
<div id="storyAdmin">

<button class="closeAdmin" onclick="closeAdmin()">Zurück</button>

<h3>Story Editor</h3>

<input id="chapter" placeholder="Staffel (1/2/3)" style="width:100%;padding:8px;margin-top:10px;">
<input id="title" placeholder="Titel" style="width:100%;padding:8px;margin-top:10px;">

<div id="editor" class="editor" contenteditable="true"></div>

<button class="btn" onclick="addStory()" style="margin-top:10px;">Posten</button>
</div>

<!-- LOGIN -->
<div id="loginBox">
<div class="login">
<h3>Admin Login</h3>
<input id="u" placeholder="User">
<input id="p" type="password" placeholder="Passwort">
<button class="btn" onclick="login()">Login</button>
</div>
</div>

<!-- FLOAT BUTTON -->
<div id="openAdminBtn" onclick="openAdmin()">🧠 Admin</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBfcD74FW6VcsdYGcc0xIHC-5M2W4z0E8s",
  authDomain: "sleepless-city.firebaseapp.com",
  projectId: "sleepless-city",
  storageBucket: "sleepless-city.firebasestorage.app",
  messagingSenderId: "34631955151",
  appId: "1:34631955151:web:107f9312dae475fac23dba"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storiesRef = db.collection("stories");

let loggedIn=false;

/* HOTKEY */
document.addEventListener("keydown",e=>{
if(e.ctrlKey && e.altKey && e.key.toLowerCase()==="a"){
document.getElementById("loginBox").style.display="flex";
}
});

/* LOGIN */
function login(){
if(document.getElementById("u").value==="admin" &&
document.getElementById("p").value==="1234"){
loggedIn=true;
document.getElementById("loginBox").style.display="none";
document.getElementById("openAdminBtn").style.display="block";
}
}

/* OPEN ADMIN */
function openAdmin(){
if(loggedIn){
document.getElementById("storyAdmin").style.display="block";
}
}

/* CLOSE ADMIN (NEU) */
function closeAdmin(){
document.getElementById("storyAdmin").style.display="none";
}

/* ADD STORY */
function addStory(){
storiesRef.add({
chapter:document.getElementById("chapter").value,
title:document.getElementById("title").value,
content:document.getElementById("editor").innerHTML,
time:Date.now()
});
}

/* LOAD */
storiesRef.orderBy("time","desc").onSnapshot(snap=>{
let c=document.getElementById("storyList");
c.innerHTML="";

let last="";

snap.forEach(doc=>{
let s=doc.data();

if(s.chapter!==last){
c.innerHTML+=`<div class="chapter">Staffel ${s.chapter}</div>`;
last=s.chapter;
}

c.innerHTML+=`
<div class="story-box">
<button class="delBtn" onclick="storiesRef.doc('${doc.id}').delete()">X</button>
<h3>${s.title}</h3>
<div>${s.content}</div>
</div>`;
});
});

</script>

</body>
</html>
