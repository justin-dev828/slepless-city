<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{background:black;color:#FFD700;overflow-x:hidden;}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df") center/cover no-repeat;
filter:brightness(0.25);
z-index:-2;
}

body::after{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:-1;
}

nav{
position:fixed;
top:0;
width:100%;
padding:15px;
display:flex;
justify-content:center;
gap:20px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
z-index:1000;
}

nav a{color:#FFD700;text-decoration:none;}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
text-align:center;
}

.neon-box{
padding:20px 40px;
border:2px solid #FFD700;
box-shadow:0 0 20px #FFD700;
cursor:pointer;
}

.btn{
padding:15px 30px;
border:2px solid #FFD700;
background:transparent;
color:#FFD700;
cursor:pointer;
}

/* LOGIN MODAL */
#login-modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
border:1px solid #FFD700;
padding:30px;
text-align:center;
}

.login-box input{
margin:10px;
padding:10px;
background:black;
border:1px solid #FFD700;
color:#FFD700;
}

/* ADMIN PANEL */
#admin-panel{
display:none;
padding:60px 20px;
text-align:center;
}

.toggle{
padding:20px;
border:1px solid #FFD700;
cursor:pointer;
margin:10px;
display:inline-block;
}

.toggle.active{
background:#FFD700;
color:black;
}

.skyline{
position:fixed;
bottom:0;
width:100%;
height:180px;
background:url("https://i.imgur.com/3ZQ3Z9Q.png") repeat-x;
animation:move 30s linear infinite;
opacity:0.3;
z-index:-1;
}

@keyframes move{
from{background-position:0;}
to{background-position:-1000px;}
}
</style>
</head>

<body>

<div id="login-modal">
<div class="login-box">
<h2>Admin Login</h2>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Passwort"><br>
<button onclick="login()">Login</button>
</div>
</div>

<div class="skyline"></div>

<nav>
<a href="#">Home</a>
<a href="#">Team</a>
<a href="#">Discord</a>
</nav>

<section class="hero">
<div class="neon-box" onclick="openLogin()">
<h1>THE SLEEPLESS CITY</h1>
<p>Klick 1x → Admin Login</p>
</div>
</section>

<section id="admin-panel">
<h2>🟢 ADMIN PANEL</h2>

<div id="maintenanceBtn" class="toggle" onclick="toggleMaintenance()">
🚧 Wartungsmodus AUS
</div>

</section>

<script>
// Fake Datenbank (Frontend)
const users = [
{user:"admin", pass:"1234"},
{user:"dev", pass:"2026"}
];

// Wartung prüfen
if(localStorage.getItem("maintenance")==="on"){
activateMaintenance();
}

// LOGIN UI
function openLogin(){
document.getElementById("login-modal").style.display="flex";
}

// LOGIN SYSTEM
function login(){
let u = document.getElementById("user").value;
let p = document.getElementById("pass").value;

let valid = users.find(acc => acc.user===u && acc.pass===p);

if(valid){
document.getElementById("login-modal").style.display="none";
document.getElementById("admin-panel").style.display="block";
updateUI();
}else{
alert("Falsch");
}
}

// TOGGLE
function toggleMaintenance(){
let state = localStorage.getItem("maintenance");

if(state==="on"){
localStorage.setItem("maintenance","off");
}else{
localStorage.setItem("maintenance","on");
}

updateUI();
location.reload();
}

// BUTTON UI UPDATE
function updateUI(){
let btn = document.getElementById("maintenanceBtn");
if(localStorage.getItem("maintenance")==="on"){
btn.classList.add("active");
btn.innerText="🚧 Wartungsmodus AN";
}else{
btn.classList.remove("active");
btn.innerText="🚧 Wartungsmodus AUS";
}
}

// WARTUNGSSEITE
function activateMaintenance(){
document.body.innerHTML=`
<div style="height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;background:black;color:#FFD700;">
<h1>🚧 Wartungsmodus</h1>
<button onclick="bypass()">Admin Login</button>
</div>`;
}

// BYPASS
function bypass(){
let u = prompt("User");
let p = prompt("Pass");

let valid = users.find(acc => acc.user===u && acc.pass===p);

if(valid){
localStorage.setItem("maintenance","off");
location.reload();
}else{
alert("Falsch");
}
}

// INIT UI
updateUI();
</script>

</body>
</html>
