<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Slepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body {background:black;color:#FFD700;overflow-x:hidden;}

/* PARTICLES */
#particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

/* NAV */
nav {
    position: fixed;
    width: 100%;
    padding: 15px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    gap: 25px;
}
nav a {color:#FFD700;text-decoration:none;}
nav a:hover {text-shadow:0 0 10px #FFD700;}

/* HERO */
.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
}

/* NEON BORDER */
.neon-box {
    padding:20px 40px;
    border:2px solid #FFD700;
    animation: glow 2s infinite alternate;
}
@keyframes glow {
    from {box-shadow:0 0 10px #FFD700;}
    to {box-shadow:0 0 30px #FFD700;}
}

/* BUTTON */
.btn {
    padding:15px 30px;
    border:2px solid #FFD700;
    background:none;
    color:#FFD700;
    cursor:pointer;
}
.btn:hover {box-shadow:0 0 20px #FFD700;}

/* SECTION */
.section {padding:80px 20px;text-align:center;}

/* TEAM */
.team {
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}
.member {
    border:1px solid #FFD700;
    padding:20px;
    width:200px;
}
.member img {
    width:100%;
    border-radius:10px;
}
.member:hover {box-shadow:0 0 20px #FFD700;}

</style>
</head>

<body>

<div id="particles-js"></div>

<nav>
<a href="#home">Home</a>
<a href="#team">Team</a>
<a href="#discord">Discord</a>
</nav>

<section class="hero" id="home">
<div class="neon-box">
<h1>THE SLEEPLESS CITY</h1>
</div>

<button class="btn" onclick="window.location.href='https://discord.gg/4vmtpMnhNf'">
🚀 Join Now
</button>
</section>

<section class="section" id="team">
<h2>Team</h2>
<div class="team">

<div class="member">
<img src="https://i.pravatar.cc/200?img=1">
<h3>Owner</h3>
<p>Leitung</p>
</div>

<div class="member">
<img src="https://i.pravatar.cc/200?img=2">
<h3>Admin</h3>
<p>Verwaltung</p>
</div>

<div class="member">
<img src="https://i.pravatar.cc/200?img=3">
<h3>Support</h3>
<p>Hilfe & Tickets</p>
</div>

</div>
</section>

<section class="section" id="discord">
<h2>Discord</h2>

<iframe src="https://discord.com/widget?id=1463968232015659228&theme=dark"
width="350" height="500" allowtransparency="true" frameborder="0"></iframe>

</section>

<!-- MUSIC -->
<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b0c3c.mp3" type="audio/mp3">
</audio>

<!-- PARTICLES SCRIPT -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 80 },
    color: { value: "#FFD700" },
    shape: { type: "circle" },
    opacity: { value: 0.5 },
    size: { value: 3 },
    move: { enable: true, speed: 2 }
  }
});
</script>

</body>
</html>
