<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sleepless City</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#0b0f14;
color:#e6e6e6;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df") center/cover no-repeat;
filter:brightness(0.25);
z-index:-2;
}
body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.65);
z-index:-1;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:14px;
display:flex;
justify-content:center;
gap:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.08);
z-index:1000;
}
nav a{color:#cfd6dd;text-decoration:none;}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:15px;
}

/* BUTTON */
.btn{
padding:10px 20px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:#fff;
border-radius:10px;
cursor:pointer;
}

/* GLASS */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:14px;
padding:15px;
}

/* STORY */
.story-box{margin:10px auto;max-width:800px;}

/* OVERLAY */
#overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(6px);
z-index:3000;
}

/* ANIMATION */
@keyframes popIn{
0%{opacity:0;transform:scale(0.8) translate(-50%,-50%);}
100%{opacity:1;transform:scale(1) translate(-50%,-50%);}
}

/* ADMIN */
#storyAdmin{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(20,25,35,0.95);
padding:20px;
border-radius:14px;
width:350px;
z-index:4000;
animation:popIn 0.25s ease;
}

/* EDITOR */
.toolbar button{margin:2px;}
.editor{
min-height:120px;
background:#111;
padding:10px;
border-radius:8px;
margin-top:5px;
}
</style>
</head>

<body>

<div id="overlay" onclick="closeAdmin()"></div>

<!-- NAV -->
<nav>
<a href="#home">Home</a>
<a href="#story">Story</a>
</nav>

<!-- HERO -->
<section class="hero" id="home">
<h1>THE SLEEPLESS CITY</h1>
<button class="btn" onclick="window.location.href='https://discord.gg/'">Discord</button>
</section>

<!-- STORY -->
<section id="story">
<h2 style="text-align:center;">📖 Story</h2>
<div id="storyList"></div>
</section>

<!-- ADMIN -->
<div id="storyAdmin">

<div style="display:flex;justify-content:space-between;">
<h3>Editor</h3>
<button class="btn" onclick="closeAdmin()">X</button>
</div>

<input id="storyTitle" placeholder="Titel" style="width:100%;margin:5px 0;">

<!-- TOOLBAR -->
<div class="toolbar">
<button onclick="format('bold')">B</button>
<button onclick="format('italic')">I</button>
<button onclick="format('insertUnorderedList')">•</button>
<button onclick="format('formatBlock','h1')">H1</button>
<button onclick="format('formatBlock','h2')">H2</button>
<button onclick="addImage()">🖼</button>
</div>

<div id="editor" class="editor" contenteditable="true"></div>

<button class="btn" onclick="addStory()">Posten</button>

</div>

<script>

/* HOTKEY STRG + ALT + A */
document.addEventListener("keydown",e=>{
if(e.ctrlKey && e.altKey && e.key==="a"){
openAdmin();
}
});

/* OPEN / CLOSE */
function openAdmin(){
document.getElementById("storyAdmin").style.display="block";
document.getElementById("overlay").style.display="block";
}
function closeAdmin(){
document.getElementById("storyAdmin").style.display="none";
document.getElementById("overlay").style.display="none";
}

/* EDITOR */
function format(cmd,value=null){
document.execCommand(cmd,false,value);
}

function addImage(){
let url=prompt("Bild URL:");
if(url){
document.execCommand("insertImage",false,url);
}
}

/* STORAGE (später easy upgrade auf API) */
let stories = JSON.parse(localStorage.getItem("stories")) || [];

function save(){
localStorage.setItem("stories",JSON.stringify(stories));
render();
}

function addStory(){
let title=document.getElementById("storyTitle").value;
let content=document.getElementById("editor").innerHTML;

if(!title||!content)return;

stories.push({
title:`Teil ${stories.length+1}: ${title}`,
content
});

document.getElementById("editor").innerHTML="";
document.getElementById("storyTitle").value="";
save();
}

function render(){
let c=document.getElementById("storyList");
c.innerHTML="";
stories.forEach(s=>{
c.innerHTML+=`<div class="card story-box"><h3>${s.title}</h3>${s.content}</div>`;
});
}

render();

</script>

</body>
</html>
